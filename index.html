<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis 15 Años - Julieta</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* ==========================================
           VARIABLES DE COLOR Y DISEÑO (FÁCIL EDICIÓN)
           ========================================== */
        :root {
            --color-rosado-claro: #fbebf0; 
            --color-rosado-medio: #e995a9; 
            --color-rosado-oscuro: #c25a76; 
            --color-blanco: #ffffff;
            
            --fuente-elegante: 'Cormorant Garamond', serif;
            --fuente-moderna: 'Montserrat', sans-serif;
        }

        /* Reset básico para que parezca un lienzo continuo */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--color-blanco);
            font-family: var(--fuente-moderna);
            overflow-x: hidden;
        }

        /* Contenedor principal estilo móvil */
        .invitacion-lienzo {
            max-width: 600px; 
            margin: 0 auto;
            background-color: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* Cada sección contiene una imagen y sus elementos interactivos */
        .seccion {
            position: relative;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        /* Display block quita cualquier margen blanco entre las imágenes */
        .seccion img {
            width: 100%;
            display: block; 
        }

        /* ==========================================
           ESTILOS DE BOTONES
           ========================================== */
        .boton-interactivo {
            position: absolute;
            background-color: var(--color-rosado-claro);
            color: var(--color-rosado-oscuro);
            font-family: var(--fuente-elegante);
            font-size: 1.2rem;
            font-weight: 700;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 30px;
            border: 2px solid var(--color-rosado-medio);
            box-shadow: 0 4px 10px rgba(233, 149, 169, 0.3);
            transform: translate(-50%, -50%); 
            text-align: center;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .boton-interactivo:active {
            transform: translate(-50%, -45%);
            box-shadow: 0 2px 5px rgba(233, 149, 169, 0.3);
        }

        /* ==========================================
           CUENTA REGRESIVA (IMAGEN 1)
           ========================================== */
        .contador-caja {
            position: absolute;
            top: 78%; /* Ubicado exactamente debajo de "FALTAN:" */
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(255, 255, 255, 0.9); 
            border: 2px solid var(--color-rosado-medio);
            border-radius: 20px; 
            padding: 12px; 
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr; /* Todo en una línea para ahorrar espacio */
            gap: 10px; 
            box-shadow: 0 8px 25px rgba(233, 149, 169, 0.4);
            width: 75%; 
            max-width: 320px;
            z-index: 10;
        }

        .tiempo-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--color-rosado-oscuro);
        }

        .tiempo-item span {
            font-family: var(--fuente-elegante);
            font-size: 1.8rem;
            font-weight: 700;
            line-height: 1;
        }

        .tiempo-item p {
            font-size: 0.6rem; 
            text-transform: uppercase;
            font-weight: 600;
            margin-top: 5px;
            letter-spacing: 0.5px;
        }

        /* ==========================================
           CARRUSEL DE IMÁGENES (IMAGEN 3) - CORREGIDO
           ========================================== */
        .carrusel-contenedor {
            position: absolute;
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 15px;
            padding: 10px 0;
            /* Ubicado exactamente en el espacio en blanco debajo de "MIS RECUERDOS" */
            top: 60%; 
            left: 50%;
            width: 78%;
            transform: translateX(-50%);
            -webkit-overflow-scrolling: touch; /* Desplazamiento fluido en móviles */
            -ms-overflow-style: none;  
            scrollbar-width: none;  
            z-index: 10;
        }
        
        .carrusel-contenedor::-webkit-scrollbar { 
            display: none; 
        }

        .carrusel-item {
            scroll-snap-align: center;
            /* Cada foto ocupa el 85% del ancho del contenedor para verse grande, de a una */
            flex: 0 0 70%; 
            height: 200px;   
            border-radius: 15px;
            border: 3px solid var(--color-rosado-claro);
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            object-fit: cover; 
            background-color: #fcecf0;
        }

        /* ==========================================
           BOTÓN DE MÚSICA FLOTANTE
           ========================================== */
        .boton-musica {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background-color: var(--color-rosado-claro);
            border: 2px solid var(--color-rosado-medio);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--color-rosado-oscuro);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 1000;
            animation: latido 2s infinite;
        }
        
        @keyframes latido {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .pausado {
            animation: none;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <audio id="musicaFondo" loop>
        <source src="cancion.mp3" type="audio/mpeg">
    </audio>

    <div id="toggleMusica" class="boton-musica pausado">
        🎵
    </div>

    <div class="invitacion-lienzo">

        <div class="seccion">
            <img src="portada.png" alt="Portada de la Invitación">
        </div>

        <div class="seccion">
            <img src="IMAGEN1.png" alt="Faltan...">
            <div class="contador-caja">
                <div class="tiempo-item"><span id="dias">00</span><p>Días</p></div>
                <div class="tiempo-item"><span id="horas">00</span><p>Horas</p></div>
                <div class="tiempo-item"><span id="minutos">00</span><p>Minutos</p></div>
                <div class="tiempo-item"><span id="segundos">00</span><p>Seg.</p></div>
            </div>
        </div>

        <div class="seccion">
            <img src="IMAGEN2.png" alt="Fecha y Lugar">
            <a href="https://maps.google.com" target="_blank" class="boton-interactivo" 
               style="top: 85%; left: 50%; width: 60%; font-size: 1.2rem;">
                Ver Ubicación
            </a>
        </div>

        <div class="seccion">
            <img src="IMAGEN3.png" alt="Mis Recuerdos">
            <div class="carrusel-contenedor">
                <img src="foto1.jpg"  class="carrusel-item">
                <img src="foto2.jpg"  class="carrusel-item">
                <img src="foto3.jpg"  class="carrusel-item">
                <img src="foto4.jpg"  class="carrusel-item">
            </div>
        </div>

        <div class="seccion">
            <img src="imagen4.png" alt="Confirmar Asistencia y Álbum">
            
            <a href="https://forms.google.com/..." target="_blank" class="boton-interactivo" 
               style="top: 38%; left: 50%; width: 70%;">
                Confirmar Asistencia
            </a>

            <a href="https://forms.google.com/..." id="btn-fotos" target="_blank" class="boton-interactivo" 
               style="top: 86%; left: 50%; width: 70%;">
                Subir Fotos
            </a>
        </div>

        <div class="seccion">
            <img src="imagen5.png" alt="Playlist y Regalos">
            
            <a href="https://forms.google.com/..." id="btn-cancion" target="_blank" class="boton-interactivo" 
               style="top: 38%; left: 50%; width: 70%;">
                Sugerir Canción
            </a>
        </div>

        <div class="seccion">
            <img src="imagen6.png" alt="Cierre de Invitación">
        </div>

    </div>

    <script>
        /* --- 1. CONFIGURACIÓN FECHA CUENTA REGRESIVA --- */
        const fechaEvento = new Date("Oct 10, 2026 20:00:00").getTime();

        const intervalo = setInterval(function() {
            const ahora = new Date().getTime();
            const distancia = fechaEvento - ahora;

            const dias = Math.floor(distancia / (1000 * 60 * 60 * 24));
            const horas = Math.floor((distancia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutos = Math.floor((distancia % (1000 * 60 * 60)) / (1000 * 60));
            const segundos = Math.floor((distancia % (1000 * 60)) / 1000);

            document.getElementById("dias").innerHTML = dias < 10 ? "0" + dias : dias;
            document.getElementById("horas").innerHTML = horas < 10 ? "0" + horas : horas;
            document.getElementById("minutos").innerHTML = minutos < 10 ? "0" + minutos : minutos;
            document.getElementById("segundos").innerHTML = segundos < 10 ? "0" + segundos : segundos;

            if (distancia < 0) {
                clearInterval(intervalo);
                document.getElementById("dias").innerHTML = "00";
                document.getElementById("horas").innerHTML = "00";
                document.getElementById("minutos").innerHTML = "00";
                document.getElementById("segundos").innerHTML = "00";
            }
        }, 1000);

        /* --- 2. CONFIGURACIÓN MÚSICA (AUTOPLAY) --- */
        const audio = document.getElementById("musicaFondo");
        const btnMusica = document.getElementById("toggleMusica");
        let reproducido = false;

        document.body.addEventListener('click', function() {
            if (!reproducido) {
                audio.play().catch(error => console.log("Autoplay bloqueado por el navegador"));
                btnMusica.classList.remove("pausado");
                reproducido = true;
            }
        }, { once: true });

        btnMusica.addEventListener('click', function(e) {
            e.stopPropagation();
            if (audio.paused) {
                audio.play();
                btnMusica.classList.remove("pausado");
            } else {
                audio.pause();
                btnMusica.classList.add("pausado");
            }
        });
    </script>
</body>
</html>
